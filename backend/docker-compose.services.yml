# Comprehensive Docker Compose file for all Woragis microservices
# Port allocation:
# - Services: 3010-3016 (Auth, Jobs, Skills, Management, Posts, Social Media, Files)
# - PostgreSQL: 5443-5449 (one per service)
# - Redis: 6391-6397 (one per service)
# - RabbitMQ: 5681-5687 (AMQP), 15681-15687 (Management UI)
# - Prometheus: 9091-9097
# - Loki: 3101-3107
# - Grafana: 3011-3017
# - Jaeger UI: 16687-16693

services:
  # ============================================
  # AUTH SERVICE (Port 3010)
  # ============================================
  auth-database:
    image: postgres:15-alpine
    container_name: auth-service-database
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_USER: ${POSTGRES_USER:-woragis}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-woragis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5443:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - woragis-network

  auth-redis:
    image: redis:7-alpine
    container_name: auth-service-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6391:6379"
    volumes:
      - auth-redis-data:/data
    restart: unless-stopped
    networks:
      - woragis-network

  auth-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: auth-service-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-woragis}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-woragis}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5681:5672"
      - "15681:15672"
    volumes:
      - auth-rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - woragis-network

  auth-service:
    build:
      context: ./auth/server
      dockerfile: Dockerfile
    container_name: auth-service-app
    depends_on:
      auth-database:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
      auth-rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: auth-service
      PORT: 3000
      APP_PUBLIC_URL: http://localhost:3010
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-secret-change-me}
      AUTH_JWT_TTL: ${AUTH_JWT_TTL:-24h}
      DATABASE_URL: postgres://${POSTGRES_USER:-woragis}:${POSTGRES_PASSWORD:-password}@auth-database:5432/auth_service?sslmode=disable
      REDIS_URL: redis://auth-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-woragis}:${RABBITMQ_PASSWORD:-woragis}@auth-rabbitmq:5672/${RABBITMQ_VHOST:-/}
      MONITORING_ENABLED: ${MONITORING_ENABLED:-true}
      METRICS_NAMESPACE: auth-service
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://auth-jaeger:4318}
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "3010:3000"
    restart: on-failure
    networks:
      - woragis-network

