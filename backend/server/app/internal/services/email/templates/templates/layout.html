{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>{{template "subject" .}}</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #1f2933;
      }
      .wrapper {
        width: 100%;
        background: #f5f7fb;
        padding: 24px 0;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 50px rgba(15, 23, 42, 0.1);
      }
      .header {
        padding: 24px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: #ffffff;
      }
      .header h1 {
        margin: 0;
        font-size: 24px;
      }
      .header p {
        margin: 8px 0 0 0;
        opacity: 0.9;
      }
      .content {
        padding: 32px 24px;
        line-height: 1.6;
      }
      .content a.button {
        display: inline-block;
        padding: 14px 24px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        border-radius: 9999px;
        margin: 24px 0;
      }
      .content p {
        margin: 0 0 16px 0;
      }
      .footer {
        padding: 24px;
        font-size: 13px;
        background: #f8fafc;
        color: #64748b;
      }
      .footer a {
        color: #2563eb;
        text-decoration: underline;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #e2e8f0;
        }
        .wrapper {
          background: #0f172a;
        }
        .container {
          background: #1e293b;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .content a.button {
          box-shadow: 0 5px 20px rgba(37, 99, 235, 0.25);
        }
        .footer {
          background: #0f172a;
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <div class="header">
          <h1>{{template "subject" .}}</h1>
          {{with .Preheader}}<p>{{.}}</p>{{end}}
        </div>
        <div class="content">
          {{template "body" .}}
        </div>
        <div class="footer">
          <p>You're receiving this email because you're a Woragis user.</p>
          <p>
            Woragis · 123 Creative Way · Remote City · Internet
            <br />
            Need help? <a href="{{.SupportURL}}">Contact support</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
{{end}}
