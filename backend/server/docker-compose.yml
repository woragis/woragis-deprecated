version: "3.9"

services:
  database:
    image: postgres:15-alpine
    container_name: woragis-database
    environment:
      POSTGRES_DB: woragis
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: woragis-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: woragis-app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_NAME: woragis-server
      APP_PORT: 8080
      APP_PUBLIC_URL: http://localhost:8080
      DATABASE_URL: postgres://postgres:postgres@database:5432/woragis?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      MONITORING_ENABLED: "true"
      MONITORING_DB_URL: ""
      METRICS_NAMESPACE: woragis
    ports:
      - "8080:8080"
    restart: on-failure
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: woragis-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      app:
        condition: service_started
    ports:
      - "9090:9090"
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.1.0
    container_name: woragis-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  grafana-data:

