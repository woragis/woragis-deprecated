apiVersion: v1
kind: ServiceAccount
metadata:
  name: whatsapp-worker
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: whatsapp-worker-leader-election
  namespace: default
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: whatsapp-worker-leader-election
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: whatsapp-worker-leader-election
subjects:
- kind: ServiceAccount
  name: whatsapp-worker
  namespace: default
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whatsapp-session-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany  # Required for multiple pods to access same volume
  storageClassName: nfs-client  # Use NFS or similar for ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: whatsapp-worker-config
  namespace: default
data:
  redis_url: "redis://redis-service:6379/0"
  log_level: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-worker
  namespace: default
  labels:
    app: whatsapp-worker
spec:
  replicas: 3  # Multiple replicas, but only leader is active
  selector:
    matchLabels:
      app: whatsapp-worker
  template:
    metadata:
      labels:
        app: whatsapp-worker
    spec:
      serviceAccountName: whatsapp-worker
      containers:
      - name: worker
        image: your-registry/woragis-whatsapp-worker:latest
        imagePullPolicy: Always
        env:
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: whatsapp-worker-config
              key: redis_url
        - name: WHATSAPP_SESSION_PATH
          value: /data/whatsapp-session
        - name: WHATSAPP_ENABLED
          value: "true"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: whatsapp-worker-config
              key: log_level
        - name: LEADER_ELECTION_ENABLED
          value: "true"
        - name: LEADER_ELECTION_LEASE_NAME
          value: "whatsapp-worker-leader"
        - name: LEADER_ELECTION_NAMESPACE
          value: "default"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: whatsapp-session
          mountPath: /data/whatsapp-session
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: whatsapp-session
        persistentVolumeClaim:
          claimName: whatsapp-session-pvc
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-worker
  namespace: default
  labels:
    app: whatsapp-worker
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: whatsapp-worker

