apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: default
  labels:
    app: server
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
        component: api
    spec:
      containers:
      - name: server
        image: woragis/server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8081
          name: metrics
          protocol: TCP
        env:
        - name: APP_NAME
          value: "woragis-server"
        - name: APP_ENV
          value: "production"
        - name: APP_PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: server-secrets
              key: database_url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: server-secrets
              key: redis_url
        - name: AUTH_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: server-secrets
              key: jwt_secret
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: server-secrets
              key: rabbitmq_url
        - name: AI_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: server-config
              key: ai_service_url
        - name: CREATIVE_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: server-config
              key: creative_service_url
        - name: CORS_ENABLED
          value: "true"
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: server-config
              key: cors_allowed_origins
        - name: MONITORING_ENABLED
          value: "true"
        - name: METRICS_NAMESPACE
          value: "woragis"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
      restartPolicy: Always

