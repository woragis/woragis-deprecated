apiVersion: apps/v1
kind: Deployment
metadata:
  name: creative-service
  namespace: default
  labels:
    app: creative-service
    component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: creative-service
  template:
    metadata:
      labels:
        app: creative-service
        component: service
    spec:
      containers:
      - name: service
        image: woragis/creative-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 8081
          name: metrics
          protocol: TCP
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: creative-service-secrets
              key: openai_api_key
        - name: STABILITY_AI_API_KEY
          valueFrom:
            secretKeyRef:
              name: creative-service-secrets
              key: stability_ai_api_key
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
      restartPolicy: Always

