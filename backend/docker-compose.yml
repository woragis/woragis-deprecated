services:
  database:
    image: postgres:15-alpine
    container_name: woragis-database
    environment:
      POSTGRES_DB: woragis
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: woragis-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: woragis-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-woragis}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-woragis}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: woragis-app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_NAME: woragis-server
      APP_PORT: 8080
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-secret-change-me}
      AUTH_JWT_TTL: ${AUTH_JWT_TTL:-24h}
      DATABASE_URL: postgres://postgres:postgres@database:5432/woragis?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      MONITORING_ENABLED: "true"
      MONITORING_DB_URL: ""
      METRICS_NAMESPACE: woragis
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type,X-Requested-With,X-API-Key,x-api-key}
      CORS_EXPOSED_HEADERS: ${CORS_EXPOSED_HEADERS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-86400}
      WHATSAPP_SESSION_PATH: ${WHATSAPP_SESSION_PATH:-./whatsapp-session}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      CREATIVE_SERVICE_URL: ${CREATIVE_SERVICE_URL:-http://creative-service:8000}
      RESUME_OUTPUT_DIR: /app/output
    ports:
      - "8080:8080"
    volumes:
      - ./resume-worker/output:/app/output
    restart: on-failure
  translation-worker:
    build:
      context: ./translation-worker
      dockerfile: Dockerfile
    container_name: woragis-translation-worker
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://postgres:postgres@database:5432/woragis?sslmode=disable
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://woragis:woragis@rabbitmq:5672/}
      RABBITMQ_USER: ${RABBITMQ_USER:-woragis}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-woragis}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-google}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      LIBRE_TRANSLATE_API_URL: ${LIBRE_TRANSLATE_API_URL:-}
      LIBRE_TRANSLATE_API_KEY: ${LIBRE_TRANSLATE_API_KEY:-}
      TRANSLATION_TIMEOUT: ${TRANSLATION_TIMEOUT:-30}
      TRANSLATION_MAX_RETRIES: ${TRANSLATION_MAX_RETRIES:-3}
      TRANSLATION_RETRY_DELAY: ${TRANSLATION_RETRY_DELAY:-1000}
    restart: unless-stopped
  job-application-worker:
    build:
      context: .
      dockerfile: Dockerfile.job-application-worker
    container_name: woragis-job-application-worker
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://postgres:postgres@database:5432/woragis?sslmode=disable
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://woragis:woragis@rabbitmq:5672/}
      RABBITMQ_USER: ${RABBITMQ_USER:-woragis}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-woragis}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      JOB_APPLICATION_QUEUE_NAME: ${JOB_APPLICATION_QUEUE_NAME:-job-applications.queue}
      JOB_APPLICATION_EXCHANGE: ${JOB_APPLICATION_EXCHANGE:-woragis.tasks}
      JOB_APPLICATION_ROUTING_KEY: ${JOB_APPLICATION_ROUTING_KEY:-job-applications.process}
      JOB_APPLICATION_PREFETCH_COUNT: ${JOB_APPLICATION_PREFETCH_COUNT:-1}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      JOB_APPLICATION_ENABLED: ${JOB_APPLICATION_ENABLED:-true}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      PLAYWRIGHT_SLOW_MO: ${PLAYWRIGHT_SLOW_MO:-100}
      PLAYWRIGHT_TIMEOUT: ${PLAYWRIGHT_TIMEOUT:-30000}
    restart: unless-stopped
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: woragis-ai-service
    depends_on:
      redis:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.3}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      XAI_MODEL: ${XAI_MODEL:-grok-beta}
      MANUS_API_KEY: ${MANUS_API_KEY:-}
      MANUS_BASE_URL: ${MANUS_BASE_URL:-}
      MANUS_MODEL: ${MANUS_MODEL:-manus-chat}
      CIPHER_API_KEY: ${CIPHER_API_KEY:-}
      CIPHER_BASE_URL: ${CIPHER_BASE_URL:-https://api.nofiltergpt.com/v1/chat/completions}
      CIPHER_MAX_TOKENS: ${CIPHER_MAX_TOKENS:-800}
      CIPHER_TOP_P: ${CIPHER_TOP_P:-1.0}
      CIPHER_IMAGE_URL: ${CIPHER_IMAGE_URL:-https://api.nofiltergpt.com/v1/images/generations}
      CIPHER_IMAGE_SIZE: ${CIPHER_IMAGE_SIZE:-1024x1024}
      CIPHER_IMAGE_N: ${CIPHER_IMAGE_N:-1}
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}
    ports:
      - "8000:8000"
    restart: on-failure
  creative-service:
    build:
      context: ./creative-service
      dockerfile: Dockerfile
    container_name: woragis-creative-service
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DALL_E_MODEL: ${DALL_E_MODEL:-dall-e-3}
      DALL_E_QUALITY: ${DALL_E_QUALITY:-standard}
      DALL_E_SIZE: ${DALL_E_SIZE:-1024x1024}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      REPLICATE_API_KEY: ${REPLICATE_API_KEY:-}
      STABLE_DIFFUSION_MODEL: ${STABLE_DIFFUSION_MODEL:-stability-ai/sdxl:39ed52f2a78e934b3ba6e2a89f5b1c712de7dfea535525255b1aa35c5565e08b}
      REPLICATE_VIDEO_MODEL: ${REPLICATE_VIDEO_MODEL:-stability-ai/stable-video-diffusion:3f0457e4619daac51203dedb472816fd4af51f3149fa7a9e0b5ffcf1b8172438}
      CIPHER_API_KEY: ${CIPHER_API_KEY:-}
      CIPHER_IMAGE_URL: ${CIPHER_IMAGE_URL:-https://api.nofiltergpt.com/v1/images/generations}
      CIPHER_IMAGE_SIZE: ${CIPHER_IMAGE_SIZE:-1024x1024}
      CIPHER_IMAGE_N: ${CIPHER_IMAGE_N:-1}
      RUNWAY_API_KEY: ${RUNWAY_API_KEY:-}
      DEFAULT_IMAGE_FORMAT: ${DEFAULT_IMAGE_FORMAT:-png}
      DEFAULT_DIAGRAM_FORMAT: ${DEFAULT_DIAGRAM_FORMAT:-png}
    ports:
      - "8001:8000"
    restart: on-failure
  docs-service:
    build:
      context: .
      dockerfile: Dockerfile.docs-service
    container_name: woragis-docs-service
    environment:
      ENV: ${APP_ENV:-development}
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173,*}
      DOCS_ROOT: /app/docs
      MARKDOWN_EXTENSIONS: fenced_code,codehilite,tables,toc,extra
    ports:
      - "8002:8000"
    restart: on-failure
  resume-worker:
    build:
      context: ./resume-worker
      dockerfile: ../Dockerfile.resume-worker
    container_name: woragis-resume-worker
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@database:5432/woragis?sslmode=disable
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://woragis:woragis@rabbitmq:5672/}
      RABBITMQ_USER: ${RABBITMQ_USER:-woragis}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-woragis}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RESUME_QUEUE_NAME: ${RESUME_QUEUE_NAME:-resumes.queue}
      RESUME_EXCHANGE: ${RESUME_EXCHANGE:-woragis.tasks}
      RESUME_ROUTING_KEY: ${RESUME_ROUTING_KEY:-resumes.queue}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      BACKEND_URL: ${BACKEND_URL:-http://app:8080}
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:-}
      RESUME_OUTPUT_DIR: /app/output
      RESULTS_LOG_DIR: /app/results
      LOG_DIR: /app/logs
      MAX_RETRIES: ${MAX_RETRIES:-3}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-5}
    volumes:
      - ./resume-worker/output:/app/output
      - ./resume-worker/results:/app/results
      - ./resume-worker/logs:/app/logs
    command: ["python", "src/main.py"]
    restart: unless-stopped
  email-worker:
    build:
      context: .
      dockerfile: Dockerfile.email-worker
    container_name: woragis-email-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://woragis:woragis@rabbitmq:5672/}
      RABBITMQ_USER: ${RABBITMQ_USER:-woragis}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-woragis}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      EMAIL_QUEUE_NAME: ${EMAIL_QUEUE_NAME:-emails.queue}
      EMAIL_EXCHANGE: ${EMAIL_EXCHANGE:-woragis.notifications}
      EMAIL_ROUTING_KEY: ${EMAIL_ROUTING_KEY:-emails.send}
      EMAIL_PREFETCH_COUNT: ${EMAIL_PREFETCH_COUNT:-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
    restart: unless-stopped
  whatsapp-worker:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp-worker
    container_name: woragis-whatsapp-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://woragis:woragis@rabbitmq:5672/}
      RABBITMQ_USER: ${RABBITMQ_USER:-woragis}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-woragis}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      WHATSAPP_QUEUE_NAME: ${WHATSAPP_QUEUE_NAME:-whatsapp.queue}
      WHATSAPP_EXCHANGE: ${WHATSAPP_EXCHANGE:-woragis.notifications}
      WHATSAPP_ROUTING_KEY: ${WHATSAPP_ROUTING_KEY:-whatsapp.send}
      WHATSAPP_PREFETCH_COUNT: ${WHATSAPP_PREFETCH_COUNT:-1}
      WHATSAPP_SESSION_PATH: ${WHATSAPP_SESSION_PATH:-/app/session}
    volumes:
      - ./whatsapp-worker/session:/app/session
    restart: unless-stopped
  # Ensure the main app knows where to reach ai-service
  # (defined here for visibility; env actually belongs to app service)
