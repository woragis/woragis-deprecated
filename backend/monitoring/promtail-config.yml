server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=backend"]
    relabel_configs:
      # Extract service name from container name
      - source_labels: ['__meta_docker_container_name']
        regex: 'woragis-(.+)'
        target_label: 'service'
        replacement: '${1}'
      
      # Extract container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
        replacement: '${1}'
      
      # Extract container labels
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      
      # Set log path - Docker stores logs in /var/lib/docker/containers/<container_id>/
      - source_labels: ['__meta_docker_container_id']
        target_label: '__path__'
        replacement: '/var/lib/docker/containers/${1}/*-json.log'
      
      # Add common labels
      - target_label: 'job'
        replacement: 'docker'
      - target_label: 'host'
        replacement: '${HOSTNAME}'
      - target_label: 'environment'
        replacement: 'development'
      
      # Keep only containers that match our project
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'backend'
        action: keep

    pipeline_stages:
      # Parse JSON log format from Docker
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
            tag: tag
      
      # Extract timestamp from Docker log
      - timestamp:
          source: time
          format: RFC3339Nano
      
      # Try to parse structured JSON logs from the log field
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            trace_id: trace_id
            request_id: request_id
            user_id: user_id
          source: output
      
      # If the log itself is JSON, extract fields
      - json:
          expressions:
            level: level
            message: message
            service: service
          source: output
          drop_malformed: true
      
      # Set labels from parsed fields (if available)
      - labels:
          level:
          service:
          stream:
      
      # Output the message
      - output:
          source: output
      
      # Add trace_id and request_id as labels if present
      - labels:
          trace_id:
          request_id:
