auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# Ruler configuration (minimal - we use Grafana for alerting)
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

# Retention policy: keep logs for 30 days
limits_config:
  retention_period: 720h
  max_query_length: 0h
  max_query_parallelism: 32
  max_streams_per_user: 10000
  max_line_size: 256KB
  reject_old_samples: true
  reject_old_samples_max_age: 168h

# Performance tuning
chunk_store_config:
  max_look_back_period: 0s

table_manager:
  retention_deletes_enabled: true
  retention_period: 720h
