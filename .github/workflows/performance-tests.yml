name: Performance Tests

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**/*performance*.go'
      - 'backend/**/*performance*.js'
      - 'backend/**/*performance*.py'
      - '.github/workflows/performance-tests.yml'

env:
  GO_VERSION: '1.21'
  POSTGRES_VERSION: '15-alpine'
  REDIS_VERSION: '7-alpine'
  RABBITMQ_VERSION: '3.13-management-alpine'

jobs:
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: woragis_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
          RABBITMQ_DEFAULT_VHOST: test
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: |
          cd backend/email-worker && go mod download && go mod tidy
          cd ../translation-worker && go mod download && go mod tidy
          cd ../whatsapp-worker && go mod download && go mod tidy

      - name: Wait for services
        run: sleep 15

      - name: Run email worker performance tests
        working-directory: backend/email-worker
        env:
          RABBITMQ_URL: amqp://test:test@localhost:5673/test
        run: |
          go test -tags=integration -run "Test.*Load|Test.*Latency|Test.*Rate|Benchmark" -v ./internal/integration/... > email-worker-performance.txt 2>&1 || true
          cat email-worker-performance.txt
          cp email-worker-performance.txt test-output.log || true

      - name: Run translation worker performance tests
        working-directory: backend/translation-worker
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/woragis_test?sslmode=disable
          RABBITMQ_URL: amqp://test:test@localhost:5673/test
        run: |
          go test -tags=integration -run "Test.*Load|Test.*Latency|Benchmark" -v ./internal/integration/... > translation-worker-performance.txt 2>&1 || true
          cat translation-worker-performance.txt
          cp translation-worker-performance.txt test-output.log || true

      - name: Run WhatsApp worker performance tests
        working-directory: backend/whatsapp-worker
        env:
          RABBITMQ_URL: amqp://test:test@localhost:5673/test
        run: |
          go test -tags=integration -run "Test.*Load|Test.*Latency|Test.*Rate|Benchmark" -v ./internal/integration/... > whatsapp-worker-performance.txt 2>&1 || true
          cat whatsapp-worker-performance.txt
          cp whatsapp-worker-performance.txt test-output.log || true

      - name: Upload Go workers performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-workers-performance-results
          path: |
            backend/email-worker/*performance*.txt
            backend/email-worker/test-output.log
            backend/translation-worker/*performance*.txt
            backend/translation-worker/test-output.log
            backend/whatsapp-worker/*performance*.txt
            backend/whatsapp-worker/test-output.log
          retention-days: 30
          if-no-files-found: ignore

  server-performance:
    name: Server API Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: woragis_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
          RABBITMQ_DEFAULT_VHOST: test
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/server/app/go.sum

      - name: Install dependencies
        working-directory: backend/server/app
        run: go mod download && go mod tidy

      - name: Wait for services
        run: sleep 15

      - name: Run server API performance tests
        working-directory: backend/server/app
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/woragis_test?sslmode=disable
          REDIS_URL: redis://localhost:6380/0
          RABBITMQ_URL: amqp://test:test@localhost:5673/test
        run: |
          go test -tags=integration -run "Test.*Load|Test.*Latency|Benchmark" -v ./internal/integration/... > server-performance.txt 2>&1 || true
          cat server-performance.txt
          cp server-performance.txt test-output.log || true

      - name: Upload server performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-performance-results
          path: |
            backend/server/app/*performance*.txt
            backend/server/app/test-output.log
          retention-days: 30
          if-no-files-found: ignore

  nodejs-worker-performance:
    name: Node.js Worker Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
          RABBITMQ_DEFAULT_VHOST: test
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/job-application-worker/package-lock.json

      - name: Install dependencies
        working-directory: backend/job-application-worker
        run: npm ci

      - name: Wait for RabbitMQ
        run: sleep 10

      - name: Run job-application-worker performance tests
        working-directory: backend/job-application-worker
        env:
          RABBITMQ_URL: amqp://test:test@localhost:5673/test
        run: |
          npm test -- tests/performance.test.js > job-application-worker-performance.txt 2>&1 || true
          cat job-application-worker-performance.txt
          cp job-application-worker-performance.txt test-output.log || true

      - name: Upload Node.js worker performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodejs-worker-performance-results
          path: |
            backend/job-application-worker/*performance*.txt
            backend/job-application-worker/test-output.log
          retention-days: 30
          if-no-files-found: ignore

  python-services-performance:
    name: Python Services Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
          RABBITMQ_DEFAULT_VHOST: test
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI service dependencies
        working-directory: backend/ai-service
        run: |
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio httpx || true

      - name: Install docs service dependencies
        working-directory: backend/docs-service
        run: |
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio httpx || true

      - name: Install creative service dependencies
        working-directory: backend/creative-service
        run: |
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio httpx || true

      - name: Install resume worker dependencies
        working-directory: backend/resume-worker
        run: |
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio pika || true

      - name: Wait for RabbitMQ
        run: sleep 10

      - name: Run AI service performance tests
        working-directory: backend/ai-service
        run: |
          pytest app/tests/performance_test.py -v > ai-service-performance.txt 2>&1 || true
          cat ai-service-performance.txt
          cp ai-service-performance.txt test-output.log || true

      - name: Run docs service performance tests
        working-directory: backend/docs-service
        run: |
          pytest tests/performance_test.py -v > docs-service-performance.txt 2>&1 || true
          cat docs-service-performance.txt
          cp docs-service-performance.txt test-output.log || true

      - name: Run creative service performance tests
        working-directory: backend/creative-service
        run: |
          pytest app/tests/performance_test.py -v > creative-service-performance.txt 2>&1 || true
          cat creative-service-performance.txt
          cp creative-service-performance.txt test-output.log || true

      - name: Run resume worker performance tests
        working-directory: backend/resume-worker
        env:
          RABBITMQ_URL: amqp://test:test@localhost:5673/test
        run: |
          pytest tests/performance_test.py -v > resume-worker-performance.txt 2>&1 || true
          cat resume-worker-performance.txt
          cp resume-worker-performance.txt test-output.log || true

      - name: Upload Python services performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-services-performance-results
          path: |
            backend/ai-service/*performance*.txt
            backend/ai-service/test-output.log
            backend/docs-service/*performance*.txt
            backend/docs-service/test-output.log
            backend/creative-service/*performance*.txt
            backend/creative-service/test-output.log
            backend/resume-worker/*performance*.txt
            backend/resume-worker/test-output.log
          retention-days: 30
          if-no-files-found: ignore

  performance-tests-summary:
    name: Performance Tests Summary
    runs-on: ubuntu-latest
    needs: [performance-tests, server-performance, nodejs-worker-performance, python-services-performance]
    if: always()

    steps:
      - name: Download all performance test results
        uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true

      - name: Check performance regression
        id: check_regression
        run: |
          python3 .github/scripts/check_performance_regression.py > regression-check.log 2>&1 || true
          cat regression-check.log

      - name: Upload regression check logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-regression-check-logs
          path: regression-check.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Performance Test Summary
        if: always()
        run: |
          echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Performance tests completed for all services. Check artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Service Group | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Go Workers (Email, Translation, WhatsApp) | ${{ needs.performance-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Server API | ${{ needs.server-performance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js Worker (Job Application) | ${{ needs.nodejs-worker-performance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Services (AI, Docs, Creative, Resume) | ${{ needs.python-services-performance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Go Workers: go-workers-performance-results" >> $GITHUB_STEP_SUMMARY
          echo "- Server API: server-performance-results" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js Worker: nodejs-worker-performance-results" >> $GITHUB_STEP_SUMMARY
          echo "- Python Services: python-services-performance-results" >> $GITHUB_STEP_SUMMARY
      
      - name: Check for failures
        id: check_failures
        run: |
          if [ "${{ needs.performance-tests.result }}" == "failure" ] || \
             [ "${{ needs.server-performance.result }}" == "failure" ] || \
             [ "${{ needs.nodejs-worker-performance.result }}" == "failure" ] || \
             [ "${{ needs.python-services-performance.result }}" == "failure" ]; then
            echo "has_failures=true" >> $GITHUB_OUTPUT
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Trigger notification on failure
        if: steps.check_failures.outputs.has_failures == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'notify-test-failure.yml',
              ref: context.ref,
              inputs: {
                workflow_name: 'Performance Tests',
                workflow_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                status: 'failure',
                commit_sha: context.sha,
                actor: context.actor
              }
            });
