          RABBITMQ_DEFAULT_VHOST: test
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/email-worker/go.sum

      - name: Install dependencies
        working-directory: backend/email-worker
        run: |
          echo "Installing Go dependencies..." > setup.log 2>&1
          go mod download >> setup.log 2>&1 || (cat setup.log && exit 1)
          cat setup.log

      - name: Upload setup logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-worker-setup-logs
          path: backend/email-worker/setup.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Wait for RabbitMQ
        run: sleep 10

      - name: Run email worker integration tests
        working-directory: backend/email-worker
        env:
          RABBITMQ_URL: amqp://test:test@localhost:5673/test
        run: |
          set -o pipefail
          go test -tags=integration -v ./internal/integration/... 2>&1 | tee test-output.log

      - name: Upload email worker test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-worker-integration-test-logs
          path: backend/email-worker/test-output.log
          retention-days: 30
          if-no-files-found: ignore

  translation-worker-tests:
    name: Translation Worker Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: woragis_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
          RABBITMQ_DEFAULT_VHOST: test
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/translation-worker/go.sum

      - name: Install dependencies
        working-directory: backend/translation-worker
        run: go mod download

      - name: Wait for services
        run: sleep 10

      - name: Run translation worker integration tests
        working-directory: backend/translation-worker
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/woragis_test?sslmode=disable
          RABBITMQ_URL: amqp://test:test@localhost:5673/test
        run: |
          set -o pipefail
          go test -tags=integration -v ./internal/integration/... 2>&1 | tee test-output.log

      - name: Upload translation worker test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-worker-integration-test-logs
          path: backend/translation-worker/test-output.log
          retention-days: 30
          if-no-files-found: ignore

  whatsapp-worker-tests:
    name: WhatsApp Worker Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
          RABBITMQ_DEFAULT_VHOST: test
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/whatsapp-worker/go.sum

      - name: Install dependencies
        working-directory: backend/whatsapp-worker
        run: |
          echo "Installing Go dependencies..." > setup.log 2>&1
          go mod download >> setup.log 2>&1 || (cat setup.log && exit 1)
          cat setup.log

      - name: Upload setup logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-worker-setup-logs
          path: backend/whatsapp-worker/setup.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Wait for RabbitMQ
        run: sleep 10

      - name: Run WhatsApp worker integration tests
        working-directory: backend/whatsapp-worker
        env:
          RABBITMQ_URL: amqp://test:test@localhost:5673/test
        run: |
          set -o pipefail
          go test -tags=integration -v ./internal/integration/... 2>&1 | tee test-output.log

      - name: Upload WhatsApp worker test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-worker-integration-test-logs
          path: backend/whatsapp-worker/test-output.log
          retention-days: 30
          if-no-files-found: ignore

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [server-integration-tests, email-worker-tests, translation-worker-tests, whatsapp-worker-tests]
    if: always()

    steps:
      - name: Download all test logs
        uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true

      - name: Create failure summary
        if: always()
        run: |
          echo "## Integration Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Server Integration Tests | ${{ needs.server-integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Email Worker Tests | ${{ needs.email-worker-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Translation Worker Tests | ${{ needs.translation-worker-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WhatsApp Worker Tests | ${{ needs.whatsapp-worker-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Available" >> $GITHUB_STEP_SUMMARY
          echo "- Test logs for each service are available in workflow artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage reports are available in coverage artifacts" >> $GITHUB_STEP_SUMMARY
          
          # Create a consolidated failure report if any tests failed
          if [ "${{ needs.server-integration-tests.result }}" == "failure" ] || \
             [ "${{ needs.email-worker-tests.result }}" == "failure" ] || \
             [ "${{ needs.translation-worker-tests.result }}" == "failure" ] || \
             [ "${{ needs.whatsapp-worker-tests.result }}" == "failure" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Test Failures Detected" >> $GITHUB_STEP_SUMMARY
            echo "Check the artifacts section below for detailed error logs." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload consolidated failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-failure-report
          path: |
            **/test-output.log
            **/setup.log
            **/service-health.log
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Capture workflow failure details
        if: failure()
        run: |
          echo "## Workflow Failure Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Failed Jobs:" >> $GITHUB_STEP_SUMMARY
          echo "- Server Integration Tests: ${{ needs.server-integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Email Worker Tests: ${{ needs.email-worker-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Translation Worker Tests: ${{ needs.translation-worker-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- WhatsApp Worker Tests: ${{ needs.whatsapp-worker-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Available:" >> $GITHUB_STEP_SUMMARY
          echo "Check the Artifacts section below for detailed logs, including:" >> $GITHUB_STEP_SUMMARY
          echo "- Test output logs" >> $GITHUB_STEP_SUMMARY
          echo "- Setup logs" >> $GITHUB_STEP_SUMMARY
          echo "- Service health logs" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** GitHub Actions also automatically saves complete workflow logs. Click 'View workflow run' to see all step logs."
      
      - name: Check for failures
        id: check_failures
        run: |
          if [ "${{ needs.server-integration-tests.result }}" == "failure" ] || \
             [ "${{ needs.email-worker-tests.result }}" == "failure" ] || \
             [ "${{ needs.translation-worker-tests.result }}" == "failure" ] || \
             [ "${{ needs.whatsapp-worker-tests.result }}" == "failure" ]; then
            echo "has_failures=true" >> $GITHUB_OUTPUT
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Trigger notification workflow
        if: steps.check_failures.outputs.has_failures == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'notify-test-failure.yml',
              ref: context.ref,
              inputs: {
                workflow_name: 'Integration Tests',
                workflow_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                status: 'failure',
                commit_sha: context.sha,
                actor: context.actor
              }
            });
