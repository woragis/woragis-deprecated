name: Integration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.21'
  POSTGRES_VERSION: '15-alpine'
  REDIS_VERSION: '7-alpine'
  RABBITMQ_VERSION: '3.13-management-alpine'

jobs:
  server-integration-tests:
    name: Server Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: woragis_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
          RABBITMQ_DEFAULT_VHOST: test
        ports:
          - 5673:5672
          - 15673:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/server/app/go.sum

      - name: Install dependencies
        working-directory: backend/server/app
        run: |
          echo "Installing Go dependencies..." > setup.log 2>&1
          go mod download >> setup.log 2>&1 || (cat setup.log && exit 1)
          cat setup.log

      - name: Upload setup logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-setup-logs
          path: backend/server/app/setup.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Wait for services
        run: |
          echo "Waiting for services to be ready..."
          sleep 10
          
          # Check service health and save logs
          echo "=== Service Health Check ===" > service-health.log 2>&1
          echo "Timestamp: $(date)" >> service-health.log
          echo "" >> service-health.log
          
          # Check PostgreSQL
          echo "PostgreSQL (port 5433):" >> service-health.log
          timeout 5 bash -c 'until echo > /dev/tcp/localhost/5433; do sleep 0.5; done' 2>/dev/null && echo "✅ PostgreSQL is reachable" >> service-health.log || echo "❌ PostgreSQL check failed or timeout" >> service-health.log
          
          # Check Redis
          echo "Redis (port 6380):" >> service-health.log
          timeout 5 bash -c 'until echo > /dev/tcp/localhost/6380; do sleep 0.5; done' 2>/dev/null && echo "✅ Redis is reachable" >> service-health.log || echo "❌ Redis check failed or timeout" >> service-health.log
          
          # Check RabbitMQ
          echo "RabbitMQ (port 5673):" >> service-health.log
          timeout 5 bash -c 'until echo > /dev/tcp/localhost/5673; do sleep 0.5; done' 2>/dev/null && echo "✅ RabbitMQ is reachable" >> service-health.log || echo "❌ RabbitMQ check failed or timeout" >> service-health.log
          
          # Check RabbitMQ Management API (optional)
          echo "RabbitMQ Management (port 15673):" >> service-health.log
          curl -s -f --max-time 5 http://localhost:15673/api/overview -u test:test > /dev/null 2>&1 && echo "✅ RabbitMQ Management API is accessible" >> service-health.log || echo "⚠️ RabbitMQ Management API check failed (may be normal)" >> service-health.log
          
          echo "" >> service-health.log
          echo "=== End Service Health Check ===" >> service-health.log
          cat service-health.log

      - name: Upload service health logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-service-health-logs
          path: backend/server/app/service-health.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Run server integration tests
        working-directory: backend/server/app
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/woragis_test?sslmode=disable
          REDIS_URL: redis://localhost:6380/0
          RABBITMQ_URL: amqp://test:test@localhost:5673/test
        run: |
          set -o pipefail
          go test -tags=integration -v -coverprofile=coverage.out ./internal/integration/... 2>&1 | tee test-output.log

      - name: Upload server test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-integration-test-logs
          path: backend/server/app/test-output.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload coverage reports
        uses: codecov/codecov@v4
        if: always()
        with:
          file: backend/server/app/coverage.out
          flags: integration
          name: server-integration-tests
          fail_ci_if_error: false

  email-worker-tests:
    name: Email Worker Integration Tests
    runs-on: ubuntu-latest
